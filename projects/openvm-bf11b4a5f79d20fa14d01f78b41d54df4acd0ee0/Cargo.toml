[package]
name = "beak-openvm-bf11b4a5"
version = "0.1.0"
edition = "2021"
description = "OpenVM-specific beak binaries (commit bf11b4a5)"
publish = false

[lib]
path = "src/lib/mod.rs"

[[bin]]
name = "beak-trace"
path = "src/bin/trace.rs"

[[bin]]
name = "beak-fuzz"
path = "src/bin/fuzz.rs"

[dependencies]
beak-core = { path = "../../crates/beak-core" }
clap = "4.5"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
strum = { version = "0.27", features = ["derive"] }

# OpenVM path dependencies (scoped to one specific commit)
fuzzer_utils = { path = "../../beak-py/out/openvm-bf11b4a5f79d20fa14d01f78b41d54df4acd0ee0/openvm-src/crates/fuzzer_utils" }
openvm-sdk = { path = "../../beak-py/out/openvm-bf11b4a5f79d20fa14d01f78b41d54df4acd0ee0/openvm-src/crates/sdk" }
openvm-transpiler = { path = "../../beak-py/out/openvm-bf11b4a5f79d20fa14d01f78b41d54df4acd0ee0/openvm-src/crates/toolchain/transpiler" }
openvm-rv32im-transpiler = { path = "../../beak-py/out/openvm-bf11b4a5f79d20fa14d01f78b41d54df4acd0ee0/openvm-src/extensions/rv32im/transpiler" }
openvm-instructions = { path = "../../beak-py/out/openvm-bf11b4a5f79d20fa14d01f78b41d54df4acd0ee0/openvm-src/crates/toolchain/instructions" }
