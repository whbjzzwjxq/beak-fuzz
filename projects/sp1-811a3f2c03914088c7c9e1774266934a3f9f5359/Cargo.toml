sp1-prover = { path = "../../beak-py/out/sp1-811a3f2c03914088c7c9e1774266934a3f9f5359/sp1-src/crates/prover" }
sp1-stark = { path = "../../beak-py/out/sp1-811a3f2c03914088c7c9e1774266934a3f9f5359/sp1-src/crates/stark" }
