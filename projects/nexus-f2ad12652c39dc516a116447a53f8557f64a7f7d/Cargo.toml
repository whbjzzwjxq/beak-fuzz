[package]
name = "beak-nexus-f2ad126"
version = "0.1.0"
edition = "2021"
description = "Nexus-specific beak binaries (commit f2ad126)"
publish = false

[lib]
path = "src/lib/mod.rs"

[[bin]]
name = "beak-fuzz"
path = "src/bin/fuzz.rs"

[[bin]]
name = "beak-trace"
path = "src/bin/trace.rs"

[dependencies]
beak-core = { path = "../../crates/beak-core" }
clap = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nexus-common = { path = "nexus-src/common" }
nexus-vm = { path = "nexus-src/vm" }
nexus-vm-prover2 = { path = "nexus-src/prover2/machine" }
