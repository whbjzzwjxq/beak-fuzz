nexus-common = { path = "../../beak-py/out/nexus-41c6c6080f46b97980053c47b078321225b4338a/nexus-src/common" }
nexus-vm = { path = "../../beak-py/out/nexus-41c6c6080f46b97980053c47b078321225b4338a/nexus-src/vm" }
nexus-vm-prover = { path = "../../beak-py/out/nexus-41c6c6080f46b97980053c47b078321225b4338a/nexus-src/prover" }

[patch."https://github.com/starkware-libs/stwo"]
stwo-prover = { path = "../../beak-py/out/nexus-41c6c6080f46b97980053c47b078321225b4338a/stwo-src/crates/prover" }
