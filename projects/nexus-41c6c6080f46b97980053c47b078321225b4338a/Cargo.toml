[package]
name = "beak-nexus-41c6c608"
version = "0.1.0"
edition = "2021"
description = "Nexus-specific beak binaries (commit 41c6c608)"
publish = false

[lib]
path = "src/lib/mod.rs"

[[bin]]
name = "beak-fuzz"
path = "src/bin/fuzz.rs"

[[bin]]
name = "beak-trace"
path = "src/bin/trace.rs"

[dependencies]
