[package]
name = "beak-risc0-98387806"
version = "0.1.0"
edition = "2021"
description = "Temporary RISC0-specific beak binaries (commit 98387806 / vulnerable snapshot)"
publish = false

[lib]
path = "src/lib/mod.rs"

[[bin]]
name = "beak-fuzz"
path = "src/bin/fuzz.rs"

[[bin]]
name = "beak-trace"
path = "src/bin/trace.rs"

[[bin]]
name = "beak-v1compat-regzero"
path = "src/bin/v1compat_regzero.rs"

[dependencies]
anyhow = "1.0"
beak-core = { path = "../../crates/beak-core" }
clap = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
risc0-binfmt = { path = "../../beak-py/out/risc0-98387806fe8348d87e32974468c6f35853356ad5/risc0-src/risc0/binfmt" }
risc0-circuit-rv32im = { path = "../../beak-py/out/risc0-98387806fe8348d87e32974468c6f35853356ad5/risc0-src/risc0/circuit/rv32im", features = ["prove"] }
